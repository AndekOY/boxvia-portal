name: HITL challenge preparation minimax
on:
  workflow_dispatch:
  push:
    branches:
      - draft/hitl-site-alignment-20261115
    paths:
      - 'cloudflare/hitl-challenge-prepare.js'
      - 'tests/hitl-challenge-prepare.mjs'
      - '.github/workflows/hitl-challenge-prepare.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hitl-challenge-prepare.mjs
