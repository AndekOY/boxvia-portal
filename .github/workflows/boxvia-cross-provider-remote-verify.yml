name: BoxVia Cross Provider Exclusivity - remote verification
on:
  push:
    branches:
      - work/technical-pilots-first-20261118
    paths:
      - .github/workflows/boxvia-cross-provider-remote-verify.yml
permissions:
  contents: read
concurrency:
  group: boxvia-sandbox-schema-migration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: boxvia-preview
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/technical-pilots-first-20261118
          persist-credentials: false
      - name: Verify sandbox isolation and offline cross-provider rules
        run: |
          set -euo pipefail
          node --test tests/cross-provider-exclusivity.test.mjs tests/stripe-attempt-idempotency.test.mjs tests/paypal-unified-attempt.test.mjs
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.orders-sandbox.jsonc'))
          assert c['name']=='boxvia-orders-sandbox'
          assert c['d1_databases']==[{'binding':'DB','database_name':'boxvia-bxc-sandbox','database_id':'baf79e93-cbea-4786-8779-974f3b3afbcc'}]
          assert all(c['vars'][k]=='false' for k in ('UNIFIED_ORDERS_ENABLED','PAYPAL_CHECKOUT_ENABLED','STRIPE_CHECKOUT_ENABLED'))
          assert 'routes' not in c and 'assets' not in c
          PY
      - name: Reject cross-provider insertion on remote synthetic order
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import json,subprocess,uuid
          base=['npx','--yes','wrangler@4','d1','execute','boxvia-bxc-sandbox','--config','wrangler.orders-sandbox.jsonc','--remote']
          def run(sql):
            p=subprocess.run(base+['--command',sql,'--json'],capture_output=True,text=True,timeout=90)
            try:
              d=json.loads(p.stdout)
              success=p.returncode==0 and len(d)==1 and d[0].get('success') is True
              rows=d[0].get('results',[]) if success else []
            except (ValueError,TypeError,KeyError,IndexError):
              success=False;rows=[]
            return success,rows
          ok,idx=run("SELECT name, \"unique\" AS is_unique FROM pragma_index_list('payment_attempts') WHERE name='idx_payment_attempt_one_total_per_order'")
          assert ok and idx==[{'name':'idx_payment_attempt_one_total_per_order','is_unique':1}],idx
          ok,rows=run("SELECT a.id,a.order_id,a.provider,a.amount_minor,a.currency FROM payment_attempts a JOIN service_orders o ON o.id=a.order_id JOIN service_requests r ON r.id=o.service_request_id WHERE r.customer_email='sandbox@example.invalid' AND r.request_key LIKE 'orders-acceptance-%' AND a.provider IN ('stripe','paypal') ORDER BY a.rowid DESC LIMIT 1")
          assert ok and len(rows)==1,'No synthetic reserved attempt; cross-provider probe UNESTABLISHED'
          a=rows[0]
          assert a['currency']=='USD' and a['amount_minor']==5000
          other='paypal' if a['provider']=='stripe' else 'stripe'
          probe_id=str(uuid.uuid4())
          sql="INSERT OR IGNORE INTO payment_attempts (id,order_id,provider,status,amount_minor,currency) VALUES ('"+probe_id+"','"+a['order_id']+"','"+other+"','created',5000,'USD')"
          ok,_=run(sql)
          assert ok,'Cross-provider negative insert failed unexpectedly'
          ok,rows=run("SELECT count(*) AS n FROM payment_attempts WHERE order_id='"+a['order_id']+"'")
          assert ok and rows==[{'n':1}],rows
          ok,rows=run("SELECT count(*) AS n FROM payment_attempts WHERE id='"+probe_id+"'")
          assert ok and rows==[{'n':0}],rows
          print('PASS: remote sandbox D1 prevents Stripe/PayPal cross-provider second attempt')
          PY
