name: BoxVia Preview — deploy isolated service worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: boxvia-preview
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/service-forms-20261111
          persist-credentials: false
      - name: Deploy only the dedicated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing Cloudflare deployment credentials; no deployment attempted."
            exit 2
          fi
          python3 - <<'PY'
          import json
          config = json.load(open("wrangler.service-preview.jsonc"))
          assert config["name"] == "boxvia-service-preview"
          assert config["d1_databases"][0]["database_name"] == "boxvia-bxc-sandbox"
          assert config["assets"]["directory"] == "./"
          html = open("services/technical-pilot/index.html").read()
          assert 'data-sitekey="0x4AAAAAAF9H9qiroFWGcniz"' in html
          print("Preview-only target and canonical sitekey verified.")
          PY
          npx --yes wrangler@4 deploy --config wrangler.service-preview.jsonc --keep-vars
      - name: Diagnose deployed Preview HTTP (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.error
          import urllib.request

          base = "https://boxvia-service-preview.andeks.workers.dev"
          for path in ("/api/health", "/services/technical-pilot/"):
              request = urllib.request.Request(base + path, headers={"Accept": "text/html,application/json"})
              try:
                  response = urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  status = response.status
                  headers = response.headers
                  body = response.read(8192).decode("utf-8", "replace")
              print(f"{path}: HTTP {status}")
              for name in ("content-type", "server", "cf-ray", "cf-mitigated", "location", "www-authenticate"):
                  if headers.get(name):
                      print(f"{name}: {headers[name]}")
              if status == 200 and path == "/services/technical-pilot/":
                  print("Canonical Turnstile sitekey present:",
                        'data-sitekey="0x4AAAAAAF9H9qiroFWGcniz"' in body)
              elif status != 200:
                  print("HTTP verification blocked or failed; no Cloudflare security settings changed.")
                  print("Body preview:", body[:300].replace("\\n", " "))
          PY
