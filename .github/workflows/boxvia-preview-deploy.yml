name: BoxVia Preview — deploy isolated service worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: boxvia-preview
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/service-forms-20261111
          persist-credentials: false
      - name: Deploy only the dedicated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing Cloudflare deployment credentials; no deployment attempted."
            exit 2
          fi
          python3 - <<'PY'
          import json
          config = json.load(open("wrangler.service-preview.jsonc"))
          assert config["name"] == "boxvia-service-preview"
          assert config["d1_databases"][0]["database_name"] == "boxvia-bxc-sandbox"
          assert config["assets"]["directory"] == "./"
          html = open("services/technical-pilot/index.html").read()
          assert 'data-sitekey="0x4AAAAAAF9H9qiroFWGcniz"' in html
          print("Preview-only target and canonical sitekey verified.")
          PY
          npx --yes wrangler@4 deploy --config wrangler.service-preview.jsonc --keep-vars
      - name: Verify deployed Preview HTML
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          url = "https://boxvia-service-preview.andeks.workers.dev/services/technical-pilot/"
          with urllib.request.urlopen(url, timeout=30) as response:
              html = response.read().decode("utf-8","replace")
              print("Preview HTML HTTP:", response.status)
              assert response.status == 200
              assert 'data-sitekey="0x4AAAAAAF9H9qiroFWGcniz"' in html
          print("PASS: published Preview uses canonical Turnstile key.")
          PY
