name: HITL passkey enrollment gateway preview
on:
  workflow_dispatch:
  push:
    branches:
      - draft/hitl-site-alignment-20261115
    paths:
      - 'cloudflare/hitl-passkey-enrollment-preview.js'
      - 'cloudflare/hitl-passkey-enrollment-preview.sql'
      - 'tests/hitl-passkey-enrollment-preview.mjs'
      - '.github/workflows/hitl-passkey-enrollment-preview.yml'
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hitl-passkey-enrollment-preview.mjs
