name: BoxVia PayPal Evidence - sandbox D1 preflight only

on:
  push:
    branches:
      - work/technical-pilots-first-20261118
    paths:
      - .github/workflows/boxvia-paypal-evidence-preflight.yml
      - migrations/paypal-capture-evidence-sandbox-v0.1.sql
      - scripts/check-paypal-capture-evidence-schema.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-paypal-evidence:
    runs-on: ubuntu-latest
    environment: boxvia-preview
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/technical-pilots-first-20261118
          persist-credentials: false
      - name: Verify migration and immutable evidence offline
        run: python3 scripts/check-paypal-capture-evidence-schema.py
      - name: Verify isolated target and disabled checkout
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.orders-sandbox.jsonc'))
          assert c['name']=='boxvia-orders-sandbox'
          assert c['d1_databases']==[{'binding':'DB','database_name':'boxvia-bxc-sandbox','database_id':'baf79e93-cbea-4786-8779-974f3b3afbcc'}]
          assert c['vars']=={'UNIFIED_ORDERS_ENABLED':'false','PAYPAL_CHECKOUT_ENABLED':'false','STRIPE_CHECKOUT_ENABLED':'false'}
          print('Sandbox-only target and checkout disabled')
          PY
      - name: Inspect remote D1 prerequisites without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --config wrangler.orders-sandbox.jsonc --remote --command "SELECT type,name FROM sqlite_master WHERE name IN ('service_orders','payment_attempts','fulfillment_outbox','paypal_capture_evidence','paypal_capture_evidence_no_update','paypal_capture_evidence_no_delete') ORDER BY type,name" --json > /tmp/paypal-preflight.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/paypal-preflight.json'))
          assert isinstance(data,list) and data and data[0].get('success'), 'D1 read-only inspection failed'
          rows=data[0].get('results',[])
          names={r['name'] for r in rows}
          required={'service_orders','payment_attempts','fulfillment_outbox'}
          assert required <= names, 'Missing required sandbox parent tables: '+str(required-names)
          evidence={'paypal_capture_evidence','paypal_capture_evidence_no_update','paypal_capture_evidence_no_delete'}
          present=names & evidence
          assert not present or present==evidence, 'Partial evidence schema; stop for manual review'
          print('PASS: remote sandbox prerequisite tables; evidence schema present:',sorted(present))
          print('READ-ONLY: no migration or payment activation performed')
          PY
