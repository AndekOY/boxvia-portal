name: PayPal offline tests

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'tests/**'
      - '.github/workflows/paypal-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline payment tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
