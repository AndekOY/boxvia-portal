name: BoxVia Preview — sandbox D1 intake audit (read-only)

on:
  push:
    branches:
      - audit/service-forms-20261111
    paths:
      - '.github/workflows/boxvia-sandbox-d1-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boxvia-sandbox-d1-intake
  cancel-in-progress: false

jobs:
  audit-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: boxvia-preview
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
        with:
          ref: audit/service-forms-20261111
          persist-credentials: false
      - name: Verify isolated D1 target and credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import json
          with open('wrangler.service-preview.jsonc', encoding='utf-8') as f:
              config=json.load(f)
          assert config['name']=='boxvia-service-preview'
          assert len(config['d1_databases'])==1
          db=config['d1_databases'][0]
          assert db['binding']=='DB'
          assert db['database_name']=='boxvia-bxc-sandbox'
          assert db['database_id']=='baf79e93-cbea-4786-8779-974f3b3afbcc'
          print('VERIFIED: isolated Preview database only; read-only aggregate SQL')
          PY
      - name: Check table and aggregate technical-pilot intake
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='service_requests';"
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "SELECT COUNT(*) AS technical_pilot_total, MAX(id) AS latest_id FROM service_requests WHERE service_code='technical-pilot';"
          echo "Only aggregate intake counts are reported; no request contents or personal data."
