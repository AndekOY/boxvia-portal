name: BoxVia PayPal Sandbox - secret names inventory (read-only)
on:
  push:
    branches:
      - work/technical-pilots-first-20261118
    paths:
      - .github/workflows/boxvia-paypal-worker-secret-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: boxvia-preview
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/technical-pilots-first-20261118
          persist-credentials: false
      - name: Verify isolated target and HOLD flags
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.orders-sandbox.jsonc'))
          assert c['name']=='boxvia-orders-sandbox'
          assert c['main']=='cloudflare/orders-sandbox-worker.mjs'
          assert c['d1_databases']==[{'binding':'DB','database_name':'boxvia-bxc-sandbox','database_id':'baf79e93-cbea-4786-8779-974f3b3afbcc'}]
          assert c['vars']=={'UNIFIED_ORDERS_ENABLED':'false','PAYPAL_CHECKOUT_ENABLED':'false','STRIPE_CHECKOUT_ENABLED':'false'}
          assert 'routes' not in c and 'route' not in c
          PY
      - name: Inspect isolated Worker secret names without revealing values
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 secret list --config wrangler.orders-sandbox.jsonc --json > /tmp/boxvia-secret-names.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('/tmp/boxvia-secret-names.json'))
          assert isinstance(data,list)
          names={x.get('name') for x in data if isinstance(x,dict)}
          required={'PAYPAL_SANDBOX_CLIENT_ID','PAYPAL_SANDBOX_CLIENT_SECRET'}
          found=required & names
          status='BOTH_PRESENT' if found==required else ('PARTIAL' if found else 'BOTH_ABSENT')
          print('Isolated Worker PayPal Sandbox secret readiness:',status)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### Isolated Worker PayPal secret-name inventory\\n\\n')
            f.write('Status: **'+status+'**\\n\\n')
            f.write('Names only. No secret values, no provider API call, no D1 access, no payments.\\n')
          PY
