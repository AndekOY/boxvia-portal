name: HITL signed atomic preview SQL tests
on:
  workflow_dispatch:
  push:
    branches:
      - draft/hitl-site-alignment-20261115
    paths:
      - '.github/workflows/hitl-signed-atomic.yml'
      - 'cloudflare/hitl-signed-atomic-preview.sql'
      - 'tests/test_hitl_signed_atomic.py'
jobs:
  sqlite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_hitl_signed_atomic.py
