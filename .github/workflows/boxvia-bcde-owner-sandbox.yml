name: BoxVia BCDE Owner - isolated sandbox deploy
on:
  push:
    branches:
      - work/technical-pilots-first-20261118
    paths:
      - .github/workflows/boxvia-bcde-owner-sandbox.yml
      - wrangler.bcde-owner.jsonc
      - cloudflare/bcde-owner-worker.mjs
      - cloudflare/bcde-access.mjs
      - cloudflare/bcde-owner-api.mjs
      - cloudflare/bcde-owner-console.mjs
      - tests/bcde-owner-worker.test.mjs
      - tests/bcde-access.test.mjs
      - tests/bcde-stage1.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: boxvia-preview
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/technical-pilots-first-20261118
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated owner target
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.bcde-owner.jsonc'))
          assert c['name']=='boxvia-bcde-owner'
          assert c['main']=='cloudflare/bcde-owner-worker.mjs'
          assert c['d1_databases'][0]['database_name']=='boxvia-bxc-sandbox'
          assert c['d1_databases'][0]['database_id']=='baf79e93-cbea-4786-8779-974f3b3afbcc'
          assert 'routes' not in c and 'assets' not in c
          assert 'PAYPAL' not in str(c) and 'STRIPE' not in str(c)
          assert c['r2_buckets']==[{'binding':'BCDE_ARCHIVE','bucket_name':'boxvia-bcde-archive-sandbox'}]
          PY
          node --test tests/bcde-access.test.mjs tests/bcde-owner-worker.test.mjs tests/bcde-stage1.test.mjs
      # R2 bucket is provisioned separately. This deploy token may have Workers write
      # access without R2 bucket list/create permissions; never gate deploy on them.
      # Schema was provisioned in run #16; deployment is now strictly read-only for D1.
      - name: Audit BCDE sandbox D1 prerequisites (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --config wrangler.bcde-owner.jsonc --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('service_orders','order_terms_acceptances','order_document_sources') ORDER BY name" --json > /tmp/bcde-schema-audit.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/bcde-schema-audit.json'))
          if not isinstance(data,list) or not data or not data[0].get('success'):
              raise SystemExit('BCDE sandbox D1 inspection unavailable')
          actual={row['name'] for row in data[0].get('results',[])}
          required={'service_orders','order_terms_acceptances','order_document_sources'}
          print('BCDE sandbox D1 tables present:',sorted(actual))
          missing=required-actual
          if missing:
              raise SystemExit('Missing BCDE sandbox D1 prerequisites: '+', '.join(sorted(missing)))
          print('BCDE sandbox D1 schema prerequisites confirmed')
          PY
      - name: Deploy only isolated owner Worker (requires pre-provisioned private R2 bucket)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.bcde-owner.jsonc --keep-vars
      - name: Verify deployed owner endpoint fails closed without Access session
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error
          url='https://boxvia-bcde-owner.andeks.workers.dev/'
          req=urllib.request.Request(url,headers={'User-Agent':'BoxVia-BCDE-CI/1.0'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect())
          try:
              response=opener.open(req,timeout=20)
              code=response.status
          except urllib.error.HTTPError as error:
              code=error.code
          # Without an Access identity, the endpoint must never serve the owner console.
          if code not in (401,403,302,303,307,308):
              raise SystemExit(f'Unexpected anonymous owner endpoint HTTP {code}; expected Access challenge or denial')
          print(f'Anonymous BCDE owner endpoint protected: HTTP {code}')
          PY
