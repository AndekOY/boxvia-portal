name: BoxVia Preview — idempotency integrity gate (read-only)
on:
  workflow_dispatch:
  push:
    branches:
      - audit/service-forms-20261111
    paths:
      - .github/workflows/boxvia-preview-idempotency-integrity.yml
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: boxvia-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/service-forms-20261111
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert isolated Preview D1 configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.service-preview.jsonc'))
          assert c['name']=='boxvia-service-preview'
          assert c['d1_databases'][0]['database_name']=='boxvia-bxc-sandbox'
          assert c['d1_databases'][0]['database_id']=='baf79e93-cbea-4786-8779-974f3b3afbcc'
          print('PASS: Preview-only D1')
          PY
      - name: Inspect remote D1 integrity without PII or mutations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          run_sql() {
            npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --json --command "$1" > "$2"
          }
          run_sql "SELECT COUNT(*) AS duplicate_groups FROM (SELECT request_key FROM service_requests WHERE request_key IS NOT NULL GROUP BY request_key HAVING COUNT(*) > 1);" duplicates.json
          run_sql "SELECT COUNT(*) AS malformed_digests FROM service_requests WHERE request_digest IS NOT NULL AND (length(request_digest) <> 64 OR request_digest GLOB '*[^0-9a-f]*');" digests.json
          run_sql "SELECT COUNT(*) AS missing_digest_for_key FROM service_requests WHERE request_key IS NOT NULL AND request_digest IS NULL;" missing.json
          run_sql "SELECT COUNT(*) AS total_rows, COUNT(request_key) AS keyed_rows, COUNT(request_digest) AS digested_rows FROM service_requests;" totals.json
          python3 - <<'PY'
          import json
          def rows(path):
              result=json.load(open(path))
              assert isinstance(result,list) and len(result)==1
              assert result[0]['success'] is True
              assert result[0].get('meta',{}).get('changed_db') is False
              assert result[0].get('meta',{}).get('rows_written') == 0
              return result[0]['results'][0]
          checks=[('duplicate_groups','duplicates.json'),('malformed_digests','digests.json'),('missing_digest_for_key','missing.json')]
          failed=[]
          for field,path in checks:
              count=rows(path)[field]
              print(('PASS' if count==0 else 'FAIL')+': '+field+'='+str(count))
              if count!=0: failed.append(field)
          totals=rows('totals.json')
          print('INFO: total_rows='+str(totals['total_rows'])+', keyed_rows='+str(totals['keyed_rows'])+', digested_rows='+str(totals['digested_rows']))
          assert not failed, 'D1 integrity gate failed: '+', '.join(failed)
          PY
          rm -f duplicates.json digests.json missing.json totals.json
          echo "PASS: read-only integrity checks completed"
