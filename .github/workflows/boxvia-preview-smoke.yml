name: BoxVia Preview — automated smoke and D1 audit
on:
  push:
    branches:
      - audit/service-forms-20261111
    paths:
      - .github/workflows/boxvia-preview-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: boxvia-preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployed Preview HTTP and rejection controls
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base="https://boxvia-service-preview.andeks.workers.dev"
          def call(path,method="GET",data=None,origin=None):
              headers={"Accept":"application/json"}
              if data is not None: headers["Content-Type"]="application/json"
              if origin: headers["Origin"]=origin
              req=urllib.request.Request(base+path,data=json.dumps(data).encode() if data is not None else None,headers=headers,method=method)
              try: res=urllib.request.urlopen(req,timeout=25)
              except urllib.error.HTTPError as err: res=err
              with res:
                  status=res.status
                  body=res.read(10000).decode("utf-8","replace")
              return status,body
          status,body=call("/api/health")
          print("Preview /api/health:",status)
          assert status==200 and json.loads(body).get("status")=="ok"
          status,body=call("/api/db-health")
          print("Preview /api/db-health:",status)
          assert status==200 and json.loads(body).get("database")=="connected"
          status,body=call("/api/service-request",method="POST",data={"service":"technical-pilot"},origin=base)
          print("Preview invalid submission rejected:",status)
          assert status==400
          status,body=call("/api/service-request",method="POST",data={"service":"technical-pilot"},origin="https://example.invalid")
          print("Preview cross-origin request rejected:",status)
          assert status==403
          print("Smoke PASS. Turnstile with a real token, D1 insert and Gmail delivery require separate E2E confirmation.")
          PY
      - name: Read-only aggregate Technical Pilot intake
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" && test -n "${CLOUDFLARE_ACCOUNT_ID}"
          python3 - <<'PY'
          import json
          c=json.load(open("wrangler.service-preview.jsonc"))
          assert c["name"]=="boxvia-service-preview"
          assert c["d1_databases"][0]["database_name"]=="boxvia-bxc-sandbox"
          PY
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "SELECT COUNT(*) AS technical_pilot_total, MAX(id) AS latest_id FROM service_requests WHERE service_code='technical-pilot';"
