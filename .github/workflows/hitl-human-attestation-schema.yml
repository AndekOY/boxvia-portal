name: HITL human attestation schema preview acceptance
on:
  workflow_dispatch:
  push:
    branches:
      - draft/hitl-site-alignment-20261115
    paths:
      - '.github/workflows/hitl-human-attestation-schema.yml'
jobs:
  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_DB_ID: baf79e93-cbea-4786-8779-974f3b3afbcc
      PROD_DB_ID: 9e860945-027b-4fe9-8a43-c02206b88617
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate schema locally
        run: |
          python3 - <<'PY'
          import sqlite3
          db=sqlite3.connect(':memory:')
          db.executescript(open('cloudflare/hitl-registry-migration.sql').read())
          db.executescript(open('cloudflare/hitl-human-attestation-migration.sql').read())
          tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'hitl_authenticators','hitl_auth_challenges','hitl_auth_proofs'} <= tables
          db.execute("INSERT INTO hitl_authenticators(credential_id,owner_id,public_key_cose,rp_id,enrollment_ref) VALUES('synthetic-credential','TEST_ONLY','synthetic','example.invalid','test')")
          assert db.execute("SELECT state FROM hitl_authenticators").fetchone()[0]=='PENDING'
          try:
            db.execute("INSERT INTO hitl_authenticators(credential_id,owner_id,public_key_cose,rp_id,enrollment_ref) VALUES('synthetic-credential','TEST_ONLY','synthetic','example.invalid','test')")
            raise AssertionError('duplicate credential accepted')
          except sqlite3.IntegrityError: pass
          print('PASS local schema, pending enrollment, unique credential')
          PY
      - run: npm install --no-save --no-package-lock wrangler@4
      - name: Apply only to explicitly allowlisted preview D1
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$PREVIEW_DB_ID" != "$PROD_DB_ID"
          test "$PREVIEW_DB_ID" = "baf79e93-cbea-4786-8779-974f3b3afbcc"
          npx wrangler d1 execute "$PREVIEW_DB_ID" --remote --file cloudflare/hitl-human-attestation-migration.sql
          npx wrangler d1 execute "$PREVIEW_DB_ID" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('hitl_authenticators','hitl_auth_challenges','hitl_auth_proofs') ORDER BY name;"
          echo 'PASS preview schema applied; no passkey enrolled or human approval recorded'
