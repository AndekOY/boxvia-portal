name: HITL Preview D1 concurrent release test
on:
  workflow_dispatch:
  push:
    branches:
      - draft/hitl-site-alignment-20261115
    paths:
      - '.github/workflows/hitl-preview-concurrency.yml'
jobs:
  concurrent-h5:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_DB_ID: baf79e93-cbea-4786-8779-974f3b3afbcc
      PROD_DB_ID: 9e860945-027b-4fe9-8a43-c02206b88617
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated preview D1
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$PREVIEW_DB_ID" != "$PROD_DB_ID"
          grep -q "$PREVIEW_DB_ID" wrangler.jsonc
      - run: npm install --no-save --no-package-lock wrangler@4
      - name: Concurrent H5 test on preview D1
        run: bash tests/hitl-preview-concurrency.sh
