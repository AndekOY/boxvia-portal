name: HITL Preview HTTP failure diagnostics
on:
  workflow_dispatch:
  push:
    branches:
      - draft/hitl-site-alignment-20261115
    paths:
      - '.github/workflows/hitl-preview-diagnostics.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_DB_ID: baf79e93-cbea-4786-8779-974f3b3afbcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock wrangler@4
      - name: Inspect synthetic case from failed HTTP run
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$PREVIEW_DB_ID" --remote --command "SELECT id,source_type,source_id,assessor,status FROM hitl_cases WHERE source_type='service' AND source_id=608502655;"
          npx wrangler d1 execute "$PREVIEW_DB_ID" --remote --command "SELECT gate,decision,actor FROM hitl_events WHERE case_id=(SELECT id FROM hitl_cases WHERE source_type='service' AND source_id=608502655) ORDER BY id;"
