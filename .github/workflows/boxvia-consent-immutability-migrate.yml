name: BoxVia Consent Immutability - sandbox D1 migration
on:
  push:
    branches:
      - work/technical-pilots-first-20261118
    paths:
      - .github/workflows/boxvia-consent-immutability-migrate.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boxvia-sandbox-schema-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: boxvia-preview
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/technical-pilots-first-20261118
          persist-credentials: false
      - name: Verify exact isolated target and offline immutability
        run: |
          set -euo pipefail
          python3 tests/order-consent-immutability.test.py
          python3 - <<'PY'
          import json,pathlib
          c=json.loads(pathlib.Path('wrangler.orders-sandbox.jsonc').read_text())
          assert c['name']=='boxvia-orders-sandbox'
          assert c['d1_databases']==[{'binding':'DB','database_name':'boxvia-bxc-sandbox','database_id':'baf79e93-cbea-4786-8779-974f3b3afbcc'}]
          assert all(c['vars'][k]=='false' for k in ('UNIFIED_ORDERS_ENABLED','PAYPAL_CHECKOUT_ENABLED','STRIPE_CHECKOUT_ENABLED'))
          sql=pathlib.Path('migrations/order-consent-immutability-sandbox-v0.3.sql').read_text()
          assert sql.count('CREATE TRIGGER IF NOT EXISTS')==4
          assert sql.count('RAISE(ABORT')==4
          PY
      - name: Verify remote tables and absent triggers
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --config wrangler.orders-sandbox.jsonc --remote --command "SELECT type,name FROM sqlite_master WHERE (type='table' AND name IN ('order_terms_acceptances','order_document_sources')) OR (type='trigger' AND name LIKE 'trg_order_%_no_%')" --json > /tmp/boxvia-immutability-before.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/boxvia-immutability-before.json'))
          assert len(d)==1 and d[0]['success']
          rows=d[0]['results']
          tables={r['name'] for r in rows if r['type']=='table'}
          assert tables=={'order_terms_acceptances','order_document_sources'},tables
          assert not [r for r in rows if r['type']=='trigger'], 'Existing triggers: fail closed'
          print('PASS: expected sandbox tables present; no conflicting immutability triggers')
          PY
      - name: Backup complete sandbox database before mutation
        run: |
          set -euo pipefail
          mkdir -p /tmp/boxvia-immutability-backup
          npx --yes wrangler@4 d1 export boxvia-bxc-sandbox --config wrangler.orders-sandbox.jsonc --remote --output /tmp/boxvia-immutability-backup/before-v03.sql
          test -s /tmp/boxvia-immutability-backup/before-v03.sql
      - uses: actions/upload-artifact@v4
        with:
          name: boxvia-sandbox-before-immutability-v03
          path: /tmp/boxvia-immutability-backup/before-v03.sql
          retention-days: 7
          if-no-files-found: error
      - name: Apply append-only triggers to sandbox only
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --config wrangler.orders-sandbox.jsonc --remote --file migrations/order-consent-immutability-sandbox-v0.3.sql
      - name: Verify four triggers and checkout HOLD
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --config wrangler.orders-sandbox.jsonc --remote --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name LIKE 'trg_order_%_no_%'" --json > /tmp/boxvia-immutability-after.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/boxvia-immutability-after.json'))
          assert len(d)==1 and d[0]['success']
          names={r['name'] for r in d[0]['results']}
          expected={'trg_order_terms_acceptances_no_update','trg_order_terms_acceptances_no_delete','trg_order_document_sources_no_update','trg_order_document_sources_no_delete'}
          assert names==expected,(names,expected)
          c=json.load(open('wrangler.orders-sandbox.jsonc'))
          assert all(c['vars'][k]=='false' for k in ('UNIFIED_ORDERS_ENABLED','PAYPAL_CHECKOUT_ENABLED','STRIPE_CHECKOUT_ENABLED'))
          print('PASS: immutable sandbox evidence triggers verified, payment HOLD preserved')
          PY
