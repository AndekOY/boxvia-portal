name: Public site static checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public pages
        run: node scripts/check-public-site.mjs
      - name: Verify inactive unified service catalog
        run: node --test tests/service-catalog.test.mjs tests/unified-orders.test.mjs tests/stripe-verification.test.mjs

      - name: Preflight isolated D1 migration offline
        run: python3 scripts/check-unified-orders-schema.py
