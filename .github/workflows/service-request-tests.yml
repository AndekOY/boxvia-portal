name: Service request tests
on:
  push:
    branches:
      - audit/service-forms-20261111
    paths:
      - 'cloudflare/migrations/0001_service_requests.sql'
      - 'cloudflare/service-request.js'
      - 'tests/service-request.test.mjs'
      - 'tests/verify-service-request-schema.py'
      - '.github/workflows/service-request-tests.yml'
  pull_request:
    paths:
      - 'cloudflare/migrations/0001_service_requests.sql'
      - 'cloudflare/service-request.js'
      - 'tests/service-request.test.mjs'
      - 'tests/verify-service-request-schema.py'
      - '.github/workflows/service-request-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fresh D1-compatible schema with SQLite
        run: python3 tests/verify-service-request-schema.py
      - name: Run service request unit tests
        run: node --experimental-default-type=module --test tests/service-request.test.mjs
