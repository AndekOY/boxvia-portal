name: Service request tests
on:
  pull_request:
    paths:
      - 'cloudflare/service-request.js'
      - 'tests/service-request.test.mjs'
      - '.github/workflows/service-request-tests.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/service-request.test.mjs
