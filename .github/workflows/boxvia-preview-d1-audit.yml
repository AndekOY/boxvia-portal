name: BoxVia Preview — D1 service intake audit (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - audit/service-forms-20261111
    paths:
      - .github/workflows/boxvia-preview-d1-audit.yml

permissions:
  contents: read

jobs:
  audit-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: boxvia-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/service-forms-20261111
          persist-credentials: false
      - name: Verify isolated Preview database and aggregate intake status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" && test -n "${CLOUDFLARE_ACCOUNT_ID}"
          python3 - <<'PY'
          import json
          config=json.load(open('wrangler.service-preview.jsonc'))
          assert config['name']=='boxvia-service-preview'
          assert config['d1_databases'][0]['database_name']=='boxvia-bxc-sandbox'
          print('Target verified: isolated boxvia-bxc-sandbox')
          # Read-only post-submission audit; no personal data is queried.
          PY
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='service_requests';"
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "PRAGMA table_info(service_requests);"
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='service_requests';"
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "PRAGMA index_list(service_requests);"
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "SELECT COUNT(*) AS technical_pilot_total, MAX(id) AS latest_id FROM service_requests WHERE service_code='technical-pilot';"
