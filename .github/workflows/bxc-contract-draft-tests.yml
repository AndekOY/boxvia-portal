name: BXC Contract Draft Tests
on:
  push:
    branches:
      - draft/bxc-legal-trust-v01
    paths:
      - 'cloudflare/contract-*.js'
      - 'cloudflare/contract-*.mjs'
      - 'cloudflare/contract-unicode/**'
      - '.github/workflows/bxc-contract-draft-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript module syntax
        run: |
          for file in cloudflare/contract-*.js cloudflare/contract-*.mjs; do
            node --check "$file"
          done
      - name: Trusted checkout server adapter tests
        run: node --experimental-default-type=module cloudflare/contract-checkout-server-adapter-draft.test.mjs
      - name: Accepted checkout archive bridge tests
        run: node --experimental-default-type=module cloudflare/contract-checkout-archive-bridge-draft.test.mjs
      - name: Checkout acceptance evidence tests
        run: node --experimental-default-type=module cloudflare/contract-checkout-evidence-draft.test.mjs
      - name: Pure snapshot tests
        run: node --experimental-default-type=module cloudflare/contract-confirmation-staging.test.mjs
      - name: PDF A4 tests
        run: node --experimental-default-type=module cloudflare/contract-pdf-a4.test.mjs
      - name: D1 state tests
        run: node --experimental-default-type=module cloudflare/contract-confirmation-store-staging.test.mjs
      - name: R2 storage tests
        run: node --experimental-default-type=module cloudflare/contract-private-r2-staging.test.mjs
      - name: Dedicated staging mailbox Worker gates
        run: node --experimental-default-type=module cloudflare/contract-mailbox-smoke-worker-staging.test.mjs
      - name: Controlled mailbox smoke-test mocks
        run: node --experimental-default-type=module cloudflare/contract-test-send-staging.test.mjs
      - name: Evidence-gated Resend reconciliation tests
        run: node --experimental-default-type=module cloudflare/contract-email-reconciliation-staging.test.mjs
      - name: Integrated mocked pipeline tests
        run: node --experimental-default-type=module cloudflare/contract-pipeline-staging.test.mjs
      - name: Install isolated Unicode renderer dependencies
        run: npm install --prefix cloudflare/contract-unicode --no-audit --no-fund
      - name: Unicode embedded-font A4 tests
        run: node cloudflare/contract-unicode/renderer.test.mjs

      - name: Full Unicode D1 R2 Resend mock integration
        run: node cloudflare/contract-unicode/pipeline.test.mjs
