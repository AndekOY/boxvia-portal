name: HITL human attestation fail-closed preview test
on:
  workflow_dispatch:
  push:
    branches:
      - draft/hitl-site-alignment-20261115
    paths:
      - '.github/workflows/hitl-human-attestation-hold.yml'
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock wrangler@4
      - name: Deploy dedicated preview Worker with identity requirement enabled
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cat > .hitl-hold-wrangler.json <<'EOF'
          {
            "name":"boxvia-hitl-identity-hold-test",
            "main":"cloudflare/hitl-preview-worker.js",
            "compatibility_date":"2026-11-02",
            "workers_dev":true,
            "d1_databases":[{"binding":"DB","database_name":"boxvia-hitl-preview","database_id":"baf79e93-cbea-4786-8779-974f3b3afbcc"}],
            "vars":{"HITL_REGISTRY_ENABLED":"true","HITL_HUMAN_ATTESTATION_REQUIRED":"true"}
          }
          EOF
          npx wrangler deploy --config .hitl-hold-wrangler.json > /tmp/hitl-hold-deploy.log 2>&1 || { cat /tmp/hitl-hold-deploy.log; exit 1; }
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | npx wrangler secret put HITL_OWNER_TOKEN --config .hitl-hold-wrangler.json >/dev/null
          URL=https://boxvia-hitl-identity-hold-test.andeks.workers.dev
          ready=0
          for i in $(seq 1 25); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/api/owner/hitl")
            if [ "$code" = 400 ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          echo "PASS owner token configured on isolated hold Worker"
          # Existing synthetic case with H1 and H2 already passed in preview D1.
          # If it does not exist, do not mutate customer data; fail instead.
          SOURCE=608655067
          for gate in H3 H4 H5; do
            code=$(curl -sS -o /tmp/hitl-hold-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H "Origin: $URL" -H "Content-Type: application/json" --data "{\"source_type\":\"service\",\"source_id\":$SOURCE,\"gate\":\"$gate\",\"decision\":\"PASS\",\"evidence_ref\":\"synthetic/identity-hold\"}" "$URL/api/owner/hitl")
            test "$code" = 423 || { echo "FAIL expected 423 got $code"; cat /tmp/hitl-hold-response.json; exit 1; }
            echo "PASS $gate PASS blocked without human attestation (423)"
          done
