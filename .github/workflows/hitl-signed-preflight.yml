name: HITL WebAuthn signed preflight minimax
on:
  workflow_dispatch:
  push:
    branches:
      - draft/hitl-site-alignment-20261115
    paths:
      - 'cloudflare/hitl-signed-preflight.js'
      - 'cloudflare/hitl-authenticator-spki-preview.sql'
      - 'tests/hitl-signed-preflight.mjs'
      - '.github/workflows/hitl-signed-preflight.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hitl-signed-preflight.mjs
