name: Service request release checks
on:
  push:
    branches:
      - release/service-d1-gmail-20261113
  pull_request:
    paths:
      - 'cloudflare/service-request.js'
      - 'cloudflare/worker.js'
      - 'assets/service-request.js'
      - 'tests/service-request.test.mjs'
      - '.github/workflows/service-request-release-checks.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check cloudflare/service-request.js
          node --check cloudflare/worker.js
          node --check assets/service-request.js
      - name: Service request unit tests
        run: node --experimental-default-type=module --test tests/service-request.test.mjs
