name: HITL passkey single-pass isolated preview acceptance
on:
  workflow_dispatch:
  push:
    branches: [draft/hitl-site-alignment-20261115]
    paths:
      - '.github/workflows/hitl-passkey-one-pass-preview.yml'
      - 'cloudflare/hitl-passkey-enrollment-preview.js'
      - 'cloudflare/hitl-passkey-authentication-preview.js'
      - 'cloudflare/hitl-passkey-authentication-preview.sql'
      - 'cloudflare/hitl-passkey-lifecycle-preview.sql'
      - 'cloudflare/hitl-passkey-independent-approval-preview.js'
      - 'tests/hitl-passkey-independent-approval-preview.mjs'
      - 'cloudflare/hitl-preview-worker.js'
      - 'cloudflare/hitl-passkey-owner-page-preview.js'
      - 'tests/hitl-passkey-enrollment-preview.mjs'
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_ISSUER: ${{ secrets.HITL_ACCESS_ISSUER }}
      ACCESS_AUD: ${{ secrets.HITL_ACCESS_AUD }}
      OWNER_EMAIL: ${{ secrets.HITL_OWNER_EMAIL }}
      APPROVER_EMAIL: ${{ secrets.HITL_INDEPENDENT_APPROVER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, gateway, registration, route and replay checks
        run: |
          set -euo pipefail
          node --test tests/hitl-passkey-enrollment-preview.mjs tests/hitl-passkey-registration-verify.mjs tests/hitl-passkey-independent-approval-preview.mjs
          python3 tests/test_hitl_signed_snapshot_v4.py
      - name: Enforce preview-only target and configuration
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "draft/hitl-site-alignment-20261115"
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACCESS_ISSUER ACCESS_AUD OWNER_EMAIL; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing Preview configuration::Required variable $name is not configured in GitHub Actions secrets"
              missing=1
            else
              echo "PRESENT $name (value withheld)"
            fi
          done
          if (( missing )); then
            echo "::error::Preview deployment blocked until required secrets are configured; no production fallback"
            exit 1
          fi
          if [[ ! "$ACCESS_ISSUER" =~ ^https://[a-z0-9-]+\.cloudflareaccess\.com/?$ ]]; then
            echo "::error::HITL_ACCESS_ISSUER must be a Cloudflare Access team HTTPS origin"
            exit 1
          fi
          if [[ "$OWNER_EMAIL" != *@* ]]; then
            echo "::error::HITL_OWNER_EMAIL must be a valid owner email"
            exit 1
          fi
          if [[ -n "$APPROVER_EMAIL" ]]; then
            if [[ "$APPROVER_EMAIL" != *@* || "${APPROVER_EMAIL,,}" == "${OWNER_EMAIL,,}" ]]; then
              echo "::error::Independent approver email invalid or equal to owner"
              exit 1
            fi
            echo "PASS distinct reviewer email configured (value withheld); separate Access policy still required"
          else
            echo "HOLD reviewer not configured; owner Preview checks continue; approval disabled"
          fi
          echo "PASS configured Access issuer, audience and owner; values withheld"
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Apply and inspect isolated Preview D1 schema
        shell: bash
        run: |
          set -euo pipefail
          DB=baf79e93-cbea-4786-8779-974f3b3afbcc
          PROD=9e860945-027b-4fe9-8a43-c02206b88617
          test "$DB" != "$PROD"
          npx wrangler d1 execute "$DB" --remote --file cloudflare/hitl-passkey-enrollment-preview.sql > /tmp/hitl-schema.log
          npx wrangler d1 execute "$DB" --remote --file cloudflare/hitl-passkey-authentication-preview.sql > /tmp/hitl-login-schema.log
          npx wrangler d1 execute "$DB" --remote --file cloudflare/hitl-passkey-lifecycle-preview.sql > /tmp/hitl-lifecycle-schema.log
          npx wrangler d1 execute "$DB" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('hitl_passkey_enrollments','hitl_authenticators','hitl_auth_challenges','hitl_auth_proofs','hitl_passkey_login_challenges','hitl_passkey_lifecycle_events');" --json > /tmp/hitl-schema.json
          node --input-type=module -e 'import fs from "node:fs";const data=JSON.parse(fs.readFileSync("/tmp/hitl-schema.json"));const names=new Set(data.flatMap(x=>(x.results||[]).map(y=>y.name)));for(const n of ["hitl_passkey_enrollments","hitl_authenticators","hitl_auth_challenges","hitl_auth_proofs","hitl_passkey_login_challenges","hitl_passkey_lifecycle_events"])if(!names.has(n))throw Error("Missing preview table: "+n);console.log("PASS required Preview D1 tables")'
      - name: Retrieve and validate public Cloudflare Access signing keys
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 --retry 2 "$ACCESS_ISSUER/cdn-cgi/access/certs" -o /tmp/hitl-access-jwks.json
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          const jwks=JSON.parse(fs.readFileSync("/tmp/hitl-access-jwks.json","utf8"));
          if(!Array.isArray(jwks.keys)||jwks.keys.length<1||jwks.keys.length>20)throw Error("Invalid Access JWKS");
          const keys=jwks.keys.filter(k=>k&&k.kty==="RSA"&&typeof k.kid==="string"&&k.kid.length>0&&typeof k.n==="string"&&typeof k.e==="string"&&(k.use===undefined||k.use==="sig")&&(k.alg===undefined||k.alg==="RS256")).map(k=>({kty:"RSA",kid:k.kid,n:k.n,e:k.e,alg:"RS256",use:"sig"}));
          if(keys.length<1||new Set(keys.map(k=>k.kid)).size!==keys.length)throw Error("No unique RSA signing keys");
          const fetched_at=Math.floor(Date.now()/1000);
          fs.writeFileSync("/tmp/hitl-access-public-pinned.json",JSON.stringify({keys,fetched_at}));
          console.log("PASS pinned public RSA JWKS keys:",keys.length,"(contents withheld)");
          EOF
      - name: Deploy isolated identity-HOLD Worker only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          const issuer=process.env.ACCESS_ISSUER;
          const config={
            name:"boxvia-hitl-identity-hold-test",
            main:"cloudflare/hitl-preview-worker.js",
            compatibility_date:"2026-11-02",
            workers_dev:true,
            d1_databases:[{binding:"DB",database_name:"boxvia-hitl-preview",database_id:"baf79e93-cbea-4786-8779-974f3b3afbcc"}],
            vars:{
              HITL_REGISTRY_ENABLED:"true",
              HITL_HUMAN_ATTESTATION_REQUIRED:"true",
              HITL_PASSKEY_ENROLLMENT_ENABLED:"true",
              HITL_PASSKEY_RP_ID:"boxvia-hitl-identity-hold-test.andeks.workers.dev",
              HITL_ACCESS_ISSUER:issuer,
              HITL_ACCESS_AUD:process.env.ACCESS_AUD,
              HITL_OWNER_EMAIL:process.env.OWNER_EMAIL,
              HITL_ACCESS_JWKS_PUBLIC:fs.readFileSync("/tmp/hitl-access-public-pinned.json","utf8")
            }
          };
          fs.writeFileSync(".hitl-passkey-one-pass-wrangler.json",JSON.stringify(config));
          EOF
          npx wrangler deploy --config .hitl-passkey-one-pass-wrangler.json >/tmp/hitl-deploy.log 2>&1 || { sed -E 's/[[:alnum:]_-]{60,}/[REDACTED]/g' /tmp/hitl-deploy.log; exit 1; }
          echo "PASS isolated identity-HOLD Worker deployed; production untouched"
      - name: Public HTTP denial and safe preview checks
        shell: bash
        run: |
          set -euo pipefail
          URL=https://boxvia-hitl-identity-hold-test.andeks.workers.dev
          for path in /owner/hitl/passkey /api/owner/hitl/passkey/status /api/owner/hitl/passkey/begin /api/owner/hitl/passkey/finish; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL$path")
            case "$code" in
              302|303|307|401|403) echo "PASS unauthenticated denial or Access redirect: $path ($code)";;
              *) echo "FAIL unexpected unauthenticated HTTP $code at $path"; exit 1;;
            esac
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/not-an-api")
          case "$code" in 302|303|307|404) echo "PASS unrelated path denied ($code)";; *) echo "FAIL unrelated path $code"; exit 1;; esac
          echo "PASS negative HTTP checks. Real owner WebAuthn enrollment requires interactive browser session; NOT asserted."
