name: BoxVia - Cloudflare Access app discovery (read-only)
on:
  workflow_dispatch:
  push:
    branches:
      - work/technical-pilots-first-20261118
    paths:
      - .github/workflows/boxvia-cloudflare-access-discovery.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    environment: boxvia-preview
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/technical-pilots-first-20261118
          persist-credentials: false
      - name: Confirm isolated target and HOLD
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.orders-sandbox.jsonc'))
          assert c['name']=='boxvia-orders-sandbox'
          assert c['d1_databases'][0]['database_id']=='baf79e93-cbea-4786-8779-974f3b3afbcc'
          assert all(c['vars'][k]=='false' for k in ('UNIFIED_ORDERS_ENABLED','PAYPAL_CHECKOUT_ENABLED','STRIPE_CHECKOUT_ENABLED'))
          assert 'routes' not in c and 'assets' not in c
          PY
      - name: Discover whether account token can read Cloudflare Access apps
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          assert token and account
          url='https://api.cloudflare.com/client/v4/accounts/'+account+'/access/apps?per_page=100'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'},method='GET')
          try:
              with urllib.request.urlopen(request,timeout=20) as resp:
                  payload=json.load(resp)
          except urllib.error.HTTPError as e:
              if e.code in (401,403):
                  print('ACCESS_DISCOVERY: BLOCKED_INSUFFICIENT_API_PERMISSION')
              else:
                  print('ACCESS_DISCOVERY: BLOCKED_HTTP_'+str(e.code))
              raise SystemExit(0)
          except Exception:
              print('ACCESS_DISCOVERY: BLOCKED_REQUEST_FAILED')
              raise SystemExit(0)
          if payload.get('success') is not True or not isinstance(payload.get('result'),list):
              print('ACCESS_DISCOVERY: BLOCKED_API_RESPONSE')
              raise SystemExit(0)
          apps=payload['result']
          matching=[]
          for app in apps:
              domains=app.get('domain','')
              extra=app.get('self_hosted_domains') or []
              candidates=[domains]+[x.get('domain','') for x in extra if isinstance(x,dict)]
              if any('boxvia-orders-sandbox' in d for d in candidates if isinstance(d,str)):
                  matching.append(app)
          print('ACCESS_DISCOVERY: READ_ONLY_SUCCESS')
          print('ISOLATED_SANDBOX_MATCHING_ACCESS_APPS:',len(matching))
          print('OWNER_IDENTITY_POLICY: NOT_VERIFIED')
          print('JWT_AND_ROUTE_ENFORCEMENT: NOT_VERIFIED')
          print('No Access configuration, secret, payment, or D1 writes.')
          PY
