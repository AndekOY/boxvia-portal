name: BoxVia Orders Sandbox - isolated deployment

on:
  push:
    branches:
      - work/technical-pilots-first-20261118
    paths:
      - .github/workflows/boxvia-orders-sandbox.yml
      - cloudflare/orders-sandbox-worker.mjs
      - cloudflare/commercial-payment-gate.mjs
      - cloudflare/checkout-eligibility-db.mjs
      - tests/commercial-payment-gate.test.mjs
      - cloudflare/paypal-unified-sandbox.mjs
      - tests/paypal-unified-sandbox.test.mjs
      - migrations/paypal-capture-evidence-sandbox-v0.1.sql
      - cloudflare/paypal-unified-settlement.mjs
      - tests/paypal-unified-settlement.test.mjs
      - cloudflare/paypal-unified-api.mjs
      - tests/paypal-unified-api.test.mjs
      - migrations/paypal-one-attempt-per-order-sandbox-v0.1.sql
      - cloudflare/paypal-unified-attempt.mjs
      - tests/paypal-unified-attempt.test.mjs
      - cloudflare/orders-persistence.mjs
      - cloudflare/stripe-verification.mjs
      - cloudflare/stripe-settlement.mjs
      - cloudflare/stripe-checkout.mjs
      - cloudflare/stripe-test-key.mjs
      - tests/orders-sandbox-worker.test.mjs
      - tests/stripe-checkout.test.mjs
      - tests/stripe-verification.test.mjs
      - tests/stripe-settlement.test.mjs
      - wrangler.orders-sandbox.jsonc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-orders-sandbox:
    runs-on: ubuntu-latest
    environment: boxvia-preview
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/technical-pilots-first-20261118
          persist-credentials: false
      - name: Offline test gates
        run: |
          node --test tests/service-catalog.test.mjs tests/unified-orders.test.mjs tests/orders-persistence.test.mjs tests/orders-sandbox-worker.test.mjs tests/commercial-payment-gate.test.mjs tests/paypal-unified-sandbox.test.mjs tests/paypal-unified-settlement.test.mjs tests/paypal-unified-api.test.mjs tests/paypal-unified-attempt.test.mjs tests/stripe-verification.test.mjs tests/stripe-settlement.test.mjs tests/stripe-checkout.test.mjs
          python3 scripts/check-unified-orders-schema.py
      - name: Verify isolated deployment target
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.orders-sandbox.jsonc'))
          assert c['name']=='boxvia-orders-sandbox'
          assert c['main']=='cloudflare/orders-sandbox-worker.mjs'
          assert c['d1_databases'][0]['database_name']=='boxvia-bxc-sandbox'
          assert c['d1_databases'][0]['database_id']=='baf79e93-cbea-4786-8779-974f3b3afbcc'
          assert c['vars']=={'UNIFIED_ORDERS_ENABLED':'false','PAYPAL_CHECKOUT_ENABLED':'false','STRIPE_CHECKOUT_ENABLED':'false'}
          assert 'assets' not in c and 'routes' not in c and 'route' not in c
          print('Only isolated sandbox target; all checkout disabled.')
          PY
      - name: Inspect sandbox D1 schema (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --command "SELECT name, type FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type,name" --json > /tmp/boxvia-schema-inventory.json
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/boxvia-schema-inventory.json'))
          print('Read-only sandbox schema inventory:',json.dumps(rows)[:6000])
          PY
      - name: Deploy isolated orders sandbox only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.orders-sandbox.jsonc --keep-vars

  verify-live-health:
    needs: deploy-orders-sandbox
    if: ${{ always() && needs.deploy-orders-sandbox.result == 'success' }}
    runs-on: ubuntu-latest
    environment: boxvia-preview
    timeout-minutes: 5
    steps:
      - name: Verify live sandbox health (strict acceptance gate)
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.BOXVIA_SANDBOX_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.BOXVIA_SANDBOX_ACCESS_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          url='https://boxvia-orders-sandbox.andeks.workers.dev/api/health'
          client_id=os.environ.get('CF_ACCESS_CLIENT_ID','')
          client_secret=os.environ.get('CF_ACCESS_CLIENT_SECRET','')
          if bool(client_id)!=bool(client_secret):
            raise SystemExit('Incomplete optional sandbox Access service token configuration')
          headers={'Accept':'application/json'}
          if client_id:
            headers['CF-Access-Client-Id']=client_id
            headers['CF-Access-Client-Secret']=client_secret
          request=urllib.request.Request(url,headers=headers)
          try:
            response=urllib.request.urlopen(request,timeout=30)
          except urllib.error.HTTPError as exc:
            ray=exc.headers.get('CF-Ray','not-provided')
            message=f'UNESTABLISHED: sandbox health HTTP {exc.code}; CF-Ray={ray}; Access credentials configured={bool(client_id)}. No acceptance proof.'
            print('::error::'+message)
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('### Sandbox live health: UNESTABLISHED\\n\\n'+message+'\\n')
            raise SystemExit(1)
          with response:
            if response.status!=200:
              raise SystemExit(f'Unexpected sandbox health HTTP {response.status}')
            data=json.load(response)
          assert data['service']=='boxvia-orders-sandbox'
          assert data['status']=='schema_ready'
          assert data['checkout']=='disabled'
          assert data['unified_tables_present']==5
          print('PASS: authenticated or public live sandbox health; five tables; checkout disabled')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
            summary.write('### Sandbox live health: PASS\\n\\nVerified HTTP 200, schema_ready, checkout disabled, five required tables.\\n')
          PY
