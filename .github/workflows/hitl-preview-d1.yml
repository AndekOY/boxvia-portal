name: HITL Preview D1 acceptance (isolated)
on:
  workflow_dispatch:
  push:
    branches:
      - draft/hitl-site-alignment-20261115
    paths:
      - '.github/workflows/hitl-preview-d1.yml'
jobs:
  preview-d1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_DB_ID: baf79e93-cbea-4786-8779-974f3b3afbcc
      PROD_DB_ID: 9e860945-027b-4fe9-8a43-c02206b88617
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview-only authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account ID'; exit 1; }
          test "$PREVIEW_DB_ID" != "$PROD_DB_ID"
          grep -q "$PREVIEW_DB_ID" wrangler.jsonc
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Inspect preview D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$PREVIEW_DB_ID" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('claims','service_requests','hitl_cases','hitl_events') ORDER BY name;"
      - name: Apply HITL schema to preview D1 only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$PREVIEW_DB_ID" --remote --file cloudflare/hitl-registry-migration.sql
      - name: Verify preview triggers
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$PREVIEW_DB_ID" --remote --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name LIKE 'hitl_%' ORDER BY name;"
      - name: Execute isolated preview test transaction
        shell: bash
        run: |
          set -euo pipefail
          echo 'Schema and trigger inspection completed. No synthetic customer records created.'
          echo 'Full D1 integration and concurrency tests remain pending.'
