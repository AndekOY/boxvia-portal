name: BoxVia Preview — read-only diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxvia-preview-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Preview HTTP 403 without secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          base = "https://boxvia-service-preview.andeks.workers.dev"
          for path in ["/api/health", "/services/technical-pilot/"]:
              req = urllib.request.Request(base + path, headers={"User-Agent":"Mozilla/5.0 (compatible; BoxViaDiagnostics/1.0)","Accept":"text/html,application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      status, headers, body = resp.status, resp.headers, resp.read(500)
              except urllib.error.HTTPError as err:
                  status, headers, body = err.code, err.headers, err.read(500)
              print(path, "HTTP", status, "content-type", headers.get("Content-Type"), "cf-ray-present", bool(headers.get("CF-Ray")), "server", headers.get("Server"))
              print("Body prefix:", body[:180].decode("utf-8", "replace").replace("\\n", " "))
          PY
      - name: Diagnose API rejection stage without storing a request
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          origin = "https://boxvia-service-preview.andeks.workers.dev"
          endpoint = origin + "/api/service-request"
          cases = [
              ("wrong-origin", "https://example.invalid", {}, 403),
              ("invalid-body", origin, {"service":"technical-pilot"}, 400),
          ]
          inconclusive = []
          for name, request_origin, data, expected in cases:
              request = urllib.request.Request(
                  endpoint, data=json.dumps(data).encode("utf-8"), method="POST",
                  headers={"Origin":request_origin,"Content-Type":"application/json",
                           "Accept":"application/json","User-Agent":"Mozilla/5.0 (compatible; BoxViaDiagnostics/1.0)"})
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      status, headers, body = response.status, response.headers, response.read(1024)
              except urllib.error.HTTPError as error:
                  status, headers, body = error.code, error.headers, error.read(1024)
              content_type = headers.get("Content-Type", "")
              preview = body[:240].decode("utf-8","replace").replace("\\n"," ")
              print(f"{name}: HTTP {status}; type={content_type}; server={headers.get('Server')}; cf-ray-present={bool(headers.get('CF-Ray'))}; body={preview}")
              if status == expected:
                  continue
              if status == 403 and expected == 400 and "application/json" not in content_type.lower():
                  inconclusive.append(f"{name}: upstream 403 challenge/block, application validation not reached")
              else:
                  raise AssertionError(f"{name}: expected {expected}, got {status}; inspect safe response metadata above")
          if inconclusive:
              raise RuntimeError("; ".join(inconclusive))
          print("PASS: negative API checks; no valid Turnstile token and no D1 write.")
          PY
      - name: Inspect deployed Preview without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          base = "https://boxvia-service-preview.andeks.workers.dev"
          expected = "0x4AAAAAF9H9qiroFWGcniz"
          urls = ["/api/health", "/services/technical-pilot/"]
          for path in urls:
              request = urllib.request.Request(base + path, headers={"User-Agent":"BoxVia-Preview-Diagnostics/1.0"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  body = response.read(500000).decode("utf-8", "replace")
                  print(f"{path}: HTTP {response.status}")
                  assert response.status == 200
                  if path == "/api/health":
                      data = json.loads(body)
                      assert data.get("status") == "ok", "Preview health unexpected"
                  else:
                      keys = re.findall(r'data-sitekey="([^"]+)"', body)
                      print("Published sitekeys:", keys)
                      assert keys == [expected], "Published Preview sitekey differs"
                      assert 'id="service-request-form"' in body, "Form missing"
          print("Read-only Preview checks passed; no deploy or secrets used.")
          PY
