name: BoxVia Stripe - sandbox checkout E2E initiation

on:
  workflow_dispatch:
    inputs:
      service_code:
        description: 'Fixed-price service under test'
        required: true
        type: choice
        options:
          - one-question-review
          - ai-governance-review
      service_request_id:
        description: 'Existing synthetic sandbox D1 service request ID for one-question-review'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: boxvia-stripe-checkout-e2e
  cancel-in-progress: false

jobs:
  initiate:
    runs-on: ubuntu-latest
    environment: boxvia-preview
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/technical-pilots-first-20261118
          persist-credentials: false
      - name: Verify exclusive sandbox target and fixed price
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.orders-sandbox.jsonc'))
          assert c['name']=='boxvia-orders-sandbox'
          assert c['main']=='cloudflare/orders-sandbox-worker.mjs'
          assert c['d1_databases']==[{'binding':'DB','database_name':'boxvia-bxc-sandbox','database_id':'baf79e93-cbea-4786-8779-974f3b3afbcc'}]
          assert all(c['vars'][k]=='false' for k in ('UNIFIED_ORDERS_ENABLED','PAYPAL_CHECKOUT_ENABLED','STRIPE_CHECKOUT_ENABLED'))
          assert 'routes' not in c and 'assets' not in c
          PY
      - name: Install ephemeral admin credential in sandbox Worker only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          Path('/tmp/boxvia-stripe-admin').write_text(secrets.token_hex(32))
          PY
          npx --yes wrangler@4 secret put ORDERS_SANDBOX_ADMIN_TOKEN --config wrangler.orders-sandbox.jsonc < /tmp/boxvia-stripe-admin
      - name: Create $50 order and Stripe Test Checkout via isolated Worker
        env:
          SERVICE_REQUEST_ID: ${{ inputs.service_request_id }}
          SERVICE_CODE: ${{ inputs.service_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,tempfile,os
          from pathlib import Path
          base='https://boxvia-orders-sandbox.andeks.workers.dev'
          token=Path('/tmp/boxvia-stripe-admin').read_text()
          raw=os.environ.get('SERVICE_REQUEST_ID','')
          service_code=os.environ.get('SERVICE_CODE','')
          if service_code not in ('one-question-review','ai-governance-review'):
            raise SystemExit('STOP: unsupported service code')
          if not raw.isdecimal() or int(raw)<=0:
            raise SystemExit('STOP: valid synthetic sandbox service_request_id required')
          def call(path,payload,admin=False):
            with tempfile.TemporaryDirectory() as directory:
              output=Path(directory)/'response'
              cmd=['curl','--silent','--show-error','--max-time','30','--output',str(output),'--write-out','%{http_code}','--request','POST','--header','Content-Type: application/json','--header','Origin: '+base,'--header','User-Agent: BoxVia-Sandbox-CI-Stripe/1.0','--data-binary',json.dumps(payload),base+path]
              if admin: cmd+=['--header','Authorization: Bearer '+token]
              result=subprocess.run(cmd,capture_output=True,text=True,timeout=40)
              if result.returncode: raise SystemExit('BLOCKED: sandbox HTTP transport failed; no checkout acceptance')
              try: status=int(result.stdout.strip())
              except ValueError: raise SystemExit('BLOCKED: no HTTP status')
              if status==403: raise SystemExit('BLOCKED: HTTP 403; no checkout acceptance')
              try: data=json.loads(output.read_text())
              except (OSError,ValueError): raise SystemExit('BLOCKED: non-JSON response')
              if status not in (200,201): raise SystemExit('STOP: endpoint '+path+' HTTP '+str(status)+'; no checkout acceptance')
              return status,data
          code,order=call('/api/orders/create',{'serviceRequestId':int(raw),'serviceCode':service_code},True)
          if code!=201 or order.get('created') is not True or order.get('amountMinor')!=5000 or order.get('currency')!='USD':
            raise SystemExit('STOP: order not freshly created; do not reuse lost capability')
          capability=order['capability']
          print('PASS: sandbox order created:',order['orderId'],'amount: USD 50.00')
          code,checkout=call('/api/stripe/checkout',{'orderId':order['orderId'],'capability':capability})
          if code!=201 or not checkout.get('checkoutUrl','').startswith('https://checkout.stripe.com/'):
            raise SystemExit('STOP: Stripe Checkout Session not confirmed')
          print('PASS: Stripe Test Mode Checkout Session created')
          print('Checkout URL validated but intentionally not logged.')
          print('NO CARD CHARGED. PAYMENT AND WEBHOOK NOT YET VERIFIED.')
          PY
