name: BoxVia Preview — read-only D1 acceptance audit
on:
  workflow_dispatch:
  push:
    branches:
      - audit/service-forms-20261111
    paths:
      - .github/workflows/boxvia-preview-readonly-acceptance.yml
permissions:
  contents: read
jobs:
  audit-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: boxvia-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/service-forms-20261111
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated target and read-only query
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          c=json.load(open('wrangler.service-preview.jsonc'))
          assert c['name']=='boxvia-service-preview'
          assert c['d1_databases'][0]['binding']=='DB'
          assert c['d1_databases'][0]['database_name']=='boxvia-bxc-sandbox'
          assert c['d1_databases'][0]['database_id']=='baf79e93-cbea-4786-8779-974f3b3afbcc'
          print('PASS: isolated Preview D1 target only')
          PY
      - name: Read-only Preview D1 schema and counts (no personal data)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" && test -n "${CLOUDFLARE_ACCOUNT_ID}"
          echo "=== Schema columns (no row data) ==="
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "PRAGMA table_info(service_requests);"
          echo "=== Index metadata (no row data) ==="
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "PRAGMA index_list(service_requests);"
          echo "=== Counts by service code (no email, text or request UUID) ==="
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "SELECT service_code, COUNT(*) AS request_count FROM service_requests GROUP BY service_code ORDER BY service_code;"
          echo "=== Technical Pilot #4 evidence (no email, text or request UUID) ==="
          npx --yes wrangler@4 d1 execute boxvia-bxc-sandbox --remote --config wrangler.service-preview.jsonc --command "SELECT id, service_code, status, CASE WHEN request_key IS NULL THEN 0 ELSE 1 END AS has_request_key, CASE WHEN request_digest IS NULL THEN 0 ELSE 1 END AS has_request_digest FROM service_requests WHERE id = 4 AND service_code = 'technical-pilot';"
          echo "Read-only audit finished. No D1 modifications performed."
